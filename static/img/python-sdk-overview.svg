  <rect x="385" y="47" width="185" height="35" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="477" y="64" text-anchor="middle" class="item-sm">Telemetry &amp; Observability</text>

  <rect x="190" y="92" width="185" height="35" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="282" y="113" text-anchor="middle" class="item">Object Storage</text>

  <rect x="385" y="92" width="185" height="35" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="477" y="113" text-anchor="middle" class="item">Runtime Context</text>

  <!-- ── Agent Modules (green) ── bottom center ────────────────────── -->
  <rect x="180" y="150" width="400" height="135" rx="8"
