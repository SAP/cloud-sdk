<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 300"
     width="760" height="300">
  <style>
    text { font-family: Calibri, Arial, sans-serif; fill: #1a1a1a; }
    .title { font-size: 13.5px; font-weight: bold; }
    .item  { font-size: 11px; }
    .item-sm { font-size: 10px; }
  </style>

  <!-- ── Connectivity & Identity (blue) ── left column ─────────────── -->
  <rect x="15" y="15" width="155" height="270" rx="8"
        fill="#caebfd" stroke="#428FD3" stroke-width="1.8"/>
  <text x="92" y="36" text-anchor="middle" class="title">Connectivity</text>
  <text x="92" y="51" text-anchor="middle" class="title">&amp; Identity</text>

  <rect x="25" y="65" width="135" height="40" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="92" y="89" text-anchor="middle" class="item-sm">Destination Service</text>

  <rect x="25" y="117" width="135" height="40" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="92" y="141" text-anchor="middle" class="item">Identity (IAS)</text>

  <rect x="25" y="169" width="135" height="40" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="0.7"/>
  <text x="92" y="193" text-anchor="middle" class="item">Secret Resolver</text>

  <!-- ── Core Modules (amber) ── top center ────────────────────────── -->
  <rect x="180" y="15" width="400" height="125" rx="8"
        fill="#fcefcd" stroke="#e8a000" stroke-width="1.8"/>
